version: 1
views:
  # sightmap requires a route on every view. Native screens have no URL, so this
  # is a placeholder: subtext-sim ignores routes and infers the view from its components.
  - name: Login
    route: /login
    components:
      - name: EmailField
        selector: '[identifier="login-email"]'
      - name: PasswordField
        selector: '[identifier="login-password"]'
      - name: SignInButton
        selector: '[identifier="login-submit"]'
      - name: LoginError
        selector: '[identifier="login-error"]'
